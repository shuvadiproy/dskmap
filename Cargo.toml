[package]
name = "dskmap"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fast disk usage analyzer: sorted tree view and an interactive browser"
license = "MIT"
repository = "https://github.com/shuvadiproy/dskmap"
homepage = "https://github.com/shuvadiproy/dskmap"
readme = "README.md"
keywords = ["disk", "du", "cli", "tui", "ncdu"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "dsk"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
jwalk = "0.9.0"
ratatui = "0.30.2"
trash = "5.2.9"

[dev-dependencies]
tempfile = "3.27.0"
